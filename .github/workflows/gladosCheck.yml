name: auto check

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  schedule:
    # UTC 01:00 = 北京时间 09:00，随后随机等待到 12:00 之前
    - cron: '0 1 * * *'

jobs:
  build:
    name: glados/railgun checkin
    runs-on: ubuntu-latest
      
    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: [3.13]

    # 这里加入全局环境变量，强制后续所有第三方 actions 兼容 Node.js 24 运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # 安装 python 库
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        pip install pypushdeer

    - name: Wait for random checkin time
      if: github.event_name == 'schedule'
      run: |
        python -u - <<'PY'
        from datetime import datetime, timedelta, timezone
        import random
        import time

        beijing_tz = timezone(timedelta(hours=8))
        now = datetime.now(beijing_tz)
        deadline = now.replace(hour=12, minute=0, second=0, microsecond=0)
        remaining_seconds = max(0, int((deadline - now).total_seconds()))
        delay_seconds = random.randint(0, remaining_seconds)
        target = now + timedelta(seconds=delay_seconds)
        print(f"计划签到时间（北京时间）: {target:%Y-%m-%d %H:%M:%S}，等待 {delay_seconds} 秒")
        if now >= deadline:
            print("调度已晚于北京时间 12:00，立即执行签到。")
        time.sleep(delay_seconds)
        PY

    # 执行 签到脚本
    - name: Running checkin
      run: |
        python checkin.py
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
        GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}

    - name: Keep alive
      uses: liskin/gh-workflow-keepalive@v1 
        
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 7
        delete_run_by_conclusion_pattern: success
